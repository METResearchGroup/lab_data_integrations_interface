[project]
name = "lab-data-integrations-interface"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.12"
# Shared by the API, Jetstream, and backfill images. Heavier stacks live in
# dependency groups below. `uv sync` installs every default group, which is
# the local dev install. Each image passes `--no-default-groups` and names
# only its groups. See the Dockerfiles under cloudflare/.
dependencies = [
    "boto3>=1.35.0",
    "python-dotenv>=1.2.2",
    "pyarrow==24.0.0",
    "opentelemetry-distro~=0.64b0",
    "opentelemetry-exporter-otlp~=1.43.0",
]

[project.optional-dependencies]
testing = [
    "faker>=37.0.0",
    "pytest>=8.0.0",
]
db-experiments = [
    "duckdb>=1.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "psutil>=6.0.0",
    "faker>=37.0.0",
    "boto3>=1.35.0",
]
preprocessing = [
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "complexipy>=5.1.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.400",
    "ruff>=0.9.0",
    "vulture>=2.16",
]
# API image: this group, plus ml and ingestion. uvicorn is the process
# command, so it is not imported by backend.main and has to be listed here.
# Importing backend.main also imports langchain and pyiceberg.
api = [
    "fastapi>=0.136.1",
    "uvicorn>=0.32",
    "pydantic>=2.13.3",
    # crypto extra installs cryptography, which ES256 verification needs.
    "pyjwt[crypto]>=2.13.0",
    "sqlglot>=30.18.0",
    "opentelemetry-instrumentation-fastapi~=0.64b0",
    "opentelemetry-instrumentation-logging~=0.64b0",
    "opentelemetry-instrumentation-botocore~=0.64b0",
]
ml = [
    "langchain>=1.2.17",
    "langchain-openai>=1.2.1",
    "langgraph>=1.2.10",
    "openinference-instrumentation-openai>=0.1.60",
]
# Jetstream image, and the API image, because /query imports the catalog
# and the Arrow schemas. Backfill does not import pyiceberg.
ingestion = [
    # Capped below 15 because pyiceberg pins rich<15 for its CLI's table output.
    # Nothing here needs 15: the highest floor in the tree is pydocket's 13.9.4.
    "rich>=13.9.4,<15",
    "tenacity>=9.0.0",
    "websockets>=15.0.1",
    # pyiceberg-core supplies the Rust partition transforms; partitioned writes
    # are unsupported without it.
    "pyiceberg[glue,pyiceberg-core]>=0.10.0",
]
# Backfill image. libipld is imported directly; it used to arrive via atproto.
backfill = [
    "typer>=0.25.1",
    "libipld>=3.4.1",
]
# Local tools and experiments. Not installed in the container images.
collection = [
    "atproto>=0.0.68",
    "duckdb>=1.0.0",
    "google-api-python-client>=2.198.0",
    "httplib2>=0.22.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.11.1",
    "numpy>=2.4.4",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "praw>=7.7.0",
    "prefect>=3.0.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.8.0",
    "spacy>=3.7.0",
    "tabulate>=0.10.0",
    "tqdm>=4.66.0",
    "tweepy>=4.14.0",
]

[tool.uv]
exclude-newer = "7 days"
default-groups = ["dev", "api", "ml", "ingestion", "backfill", "collection"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
filterwarnings = [
    # Legacy Python 3.10 compat shim inside opentelemetry-api (transitive dep via
    # prefect/pydocket) hits a deprecated code path even on 3.11. Not our code.
    "ignore:SelectableGroups dict interface is deprecated. Use select.:DeprecationWarning:opentelemetry.util._importlib_metadata",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# experimentation/iceberg keeps its own requirements file and venv.
# The ingestion group caps rich below 15, which matches the pyiceberg pin.
exclude = ["tests", "experiments", "experimentation/iceberg"]

[tool.vulture]
exclude = ["*venv*", "temp.py"]
min_confidence = 80
paths = ["."]
